baseURL = 'https://personal.ajlabarca.com/'
locale = 'en-US'
title = 'AJ La Barca · Photos & Music'
copyright = '© AJ La Barca. All photos are my own.'
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true
timeout = '120s'

[params]
  defaultTheme = 'dark'
  description = 'Photography and music by AJ La Barca, an aerospace PhD student in Boulder, Colorado.'
  [params.socialIcons]
    website = 'https://ajlabarca.com'
    youtube = 'https://www.youtube.com/@ajlabarca1584'

[outputs]
  home = ['HTML', 'RSS']
  page = ['HTML']
  section = ['HTML']

[imaging]
  resampleFilter = 'CatmullRom'
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75

[module]
  [[module.imports]]
    path = 'github.com/nicokaiser/hugo-theme-gallery/v4'

[menus]
  [[menus.main]]
    name = 'Photos'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'Music'
    pageRef = '/music'
    weight = 20
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 30
  [[menus.main]]
    name = 'Research & CV ↗'
    url = 'https://ajlabarca.com'
    weight = 40
