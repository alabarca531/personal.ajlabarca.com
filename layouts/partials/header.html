<header class="site-header">
<div class="header-inner">
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Home">
    <span class="brand-dot" aria-hidden="true"></span>AJ La Barca
  </a>
  {{ with site.Menus.main }}
  <nav class="nav-pills" aria-label="Main">
    <ul>
      {{ range . }}
      {{ $on := or (page.IsMenuCurrent .Menu .) (page.HasMenuCurrent .Menu .) }}
      <li><a href="{{ .URL }}"{{ if $on }} aria-current="page"{{ end }}{{ if hasPrefix .URL "http" }} rel="noopener"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
    </ul>
  </nav>
  <button class="menu-btn" id="menu-toggle" aria-expanded="false" aria-controls="menu" type="button" title="{{ T "menu" }}">
    <svg class="icon-menu" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M3 6.75A.75.75 0 0 1 3.75 6h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 6.75ZM3 12a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 12Zm0 5.25a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1-.75-.75Z"/></svg>
    <svg class="icon-close hidden" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path clip-rule="evenodd" fill-rule="evenodd" d="M5.47 5.47a.75.75 0 0 1 1.06 0L12 10.94l5.47-5.47a.75.75 0 1 1 1.06 1.06L13.06 12l5.47 5.47a.75.75 0 1 1-1.06 1.06L12 13.06l-5.47 5.47a.75.75 0 0 1-1.06-1.06L10.94 12 5.47 6.53a.75.75 0 0 1 0-1.06Z"/></svg>
  </button>
  {{ end }}
</div>
</header>
{{ partial "menu.html" . }}
