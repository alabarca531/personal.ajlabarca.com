{{/* Optional photo from assets/images/<name>.*; renders nothing if the file is absent. */}}
{{ with resources.GetMatch (printf "images/%s.*" .name) }}
{{ $s := .Resize "800x webp" }}{{ $l := .Resize "1600x webp" }}
<figure class="photo {{ $.class }}">
  <img src="{{ $s.RelPermalink }}" srcset="{{ $s.RelPermalink }} 800w, {{ $l.RelPermalink }} 1600w" sizes="{{ $.sizes | default "(max-width: 768px) 100vw, 50vw" }}" width="{{ $s.Width }}" height="{{ $s.Height }}" alt="{{ $.alt }}" loading="lazy">
</figure>
{{ end }}
